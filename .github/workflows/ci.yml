name: BookTrail CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-pr-source:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest

    steps:
      - name: Ensure main receives changes only from develop
        shell: bash
        run: |
          if [[ "$GITHUB_BASE_REF" == "main" && "$GITHUB_HEAD_REF" != "develop" ]]; then
            echo "Error: Pull requests to main must come from develop."
            exit 1
          fi

          echo "Pull request source branch is valid."

  build-and-check:
    name: Build and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Build Application
        run: npm run build
